name: scanflow
description: "Sistema de control de inventario offline para BodegaFlow."
publish_to: "none"

version: 1.1.0+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Localización oficial de Flutter (widgets de Material/Cupertino traducidos).
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Formateo de fechas/horas (marca de tiempo de los reportes).
  intl: ^0.20.3

  # Escaneo de códigos de barras con la cámara.
  mobile_scanner: ^7.4.0
  # Persistencia local 100% offline.
  sqflite: ^2.4.2
  path: ^1.9.0
  # Generación y guardado de PDFs.
  pdf: ^3.11.3
  # Impresión de reportes vía servicios nativos de impresión.
  printing: ^5.15.0
  path_provider: ^2.1.5
  # Compartir el PDF generado con otras apps.
  share_plus: ^13.3.0
  # Alerta sonora al detectar stock bajo / operación.
  audioplayers: ^6.8.1
  # Impresión de etiquetas / tickets a impresoras térmicas Bluetooth.
  print_bluetooth_thermal: ^1.2.2
  # Utilidades para generar los comandos ESC/POS.
  esc_pos_utils_plus: ^2.0.4
  # Selección de impresora Bluetooth cross-platform.
  flutter_blue_plus: ^1.35.5
  # Permisos runtime.
  permission_handler: ^12.0.0
  # Estado simple y ligero para la UI.
  provider: ^6.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  ota_update: ^7.1.0
  package_info_plus: ^10.2.1
  sqflite_common_ffi: ^2.4.2+1
  sqlite3_flutter_libs: ^0.6.0+eol
  qr_flutter: ^4.1.0
  flutter_secure_storage: 10.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  # Splash nativo Android/iOS: logo centrado sobre fondo oscuro, compatible con
  # la API de Splash de Android 12+ (sin parpadeo blanco al iniciar).
  flutter_native_splash: ^2.4.0
  path_provider_platform_interface: ^2.1.3

# Configuración del generador de íconos
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/bodegaflow_icon.png"
  min_sdk_android: 21
  # Windows: genera el .ico nativo del .exe (ventana y barra de tareas) con el
  # logo oficial de la marca (BodegaFlow), 256×256.
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  # Genera lib/l10n/app_localizations.dart a partir de los .arb (es/en).
  generate: true

# Splash nativo: fondo oscuro Olyra (#0F172A) con el logo centrado.
flutter_native_splash:
  color: "#0F172A"
  image: assets/icon/app_icon.png
  android: true
  ios: true
  android_12:
    color: "#0F172A"
    image: assets/icon/app_icon.png
  web: false
